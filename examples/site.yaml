# An example site file (design section 10). session reads it through atoom's source port: the Go file driver serves the
# document "site" from the file site.jws in the directory of --config-dir, so install this file as site.jws there.
# `session check --site examples/site.yaml` validates it.
site: docs
host: docs.example.com
issuers:                       # one or more (decision 0034); with several, /_session/signin shows one link for each
  - id: corp                   # ?issuer=corp of the sign-in paths; lower-case letters, digits and '-'
    label: Example Corp        # the sign-in page shows "Sign in with Example Corp"
    issuer: https://issuer.example.com/realms/corp-staff
    client:
      id: session-docs
      auth: private_key_jwt    # the key is the key port's purpose client-assertion, one key for every issuer; which driver holds it is a start-up setting
    scopes: [openid, profile, email]
  - id: partner
    label: Example Partner
    issuer: https://issuer.example.com/realms/partner-staff
    client:
      id: session-docs
      auth: private_key_jwt
    scopes: [openid, profile, email]
# signin:
#   remember_choice: 720h      # optional: remember the issuer a person picked for that long; unset remembers nothing
session:
  idle: 30m
  max: 8h
policy:
  bundle: policy-bundle        # the document policy-bundle.jws next to site.jws: a signed bundle (docs/policy.md)
  verify_key:                  # the one publisher key the site pins; replace it with your publisher's
    kid: publisher-1
    public_key: |
      -----BEGIN PUBLIC KEY-----
      MHYwEAYHKoZIzj0CAQYFK4EEACIDYgAEKwsvu/lKOYwP0gNG9wTasVXZHfp1bEWk
      oSq/SzJQbWqYGN9urpU1EFl6ypRKdcc8olyuacxsRDML4ZGtDcLA2gcsTUXZGfvL
      hkPfEOilNuWdXkXOQrrZsO/Retc6BTZk
      -----END PUBLIC KEY-----
# error_page: error-page       # optional: the page (error-page.jws, HTML) a navigation gets when an exchange is refused
routes:
  - match: { prefix: /assets/ }
    mode: public
  - name: admin
    match: { prefix: /admin/ }
    mode: session
  - name: billing              # Authorization: Bearer with a token whose audience is billing (RFC 8693 token exchange)
    match: { prefix: /api/billing/ }
    mode: exchange
    audience: billing
    unauthenticated: "401"
  - name: reports              # X-Session-Identity: the person's identity, signed by session's key (/_session/jwks)
    match: { prefix: /reports/ }
    mode: identity-header
    audience: reports
  - match: { prefix: /api/ }
    mode: session
    unauthenticated: "401"
  - match: { prefix: / }
    mode: session
