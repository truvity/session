# An nginx in front of one site, asking session before each request with auth_request (decisions 0011 and 0018). The ${...}
# names are addresses to fill in; the integration test (internal/nginx, `just test-nginx`) fills them with its own and runs
# this file in nginx as it is. A site copies the map, the server's settings and the six locations into its own config; every
# protected location sets $session_uri and $session_method before auth_request.
#
# What every site needs from it:
# - the check sees the path nginx routes on: $uri$is_args$args, set in the protected location before auth_request, because
#   $uri inside the check's own location is the subrequest's path; and a path the site could read differently from $uri
#   (dot segments, encoded dots, slashes, backslashes or NUL) is refused, because nginx passes the site the URI as the browser
#   sent it;
# - the sign-in prefix /_session/ goes to session without a check;
# - the check gets no body; it sees every request header, as the browser sent it;
# - every header session owns (Cookie, Authorization, X-Session-Token, X-Session-Identity) is set from the check's answer on
#   every request: an empty value makes nginx drop the header, so a browser-sent one never reaches the site;
# - auth_request takes only 2xx, 401 and 403 from the check, so session answers every refusal as a 401 with markers, and the
#   named location @session_answer turns it into the check's own answer (302, or the status and JSON body, or the error page);
# - fail closed: a check that cannot be reached, or does not answer within 4 s (longer than session's store timeout of 1.5 s
#   plus its exchange timeout of 2 s), is a 503, never an allow.
# Limits, against Envoy: only the first Set-Cookie of the check's answer reaches the browser (auth_request_set reads one value).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-session-example.pid;
events { worker_connections 256; }

http {
  access_log off;

  # 1 for a request path the site could read differently from the $uri the check gets. The query is not looked at:
  # /_session/login?return_to=%2Fapp is fine.
  map $request_uri $session_bad_path {
    default 0;
    "~*^[^?]*%(2e|2f|5c|00)" 1;
    "~^[^?]*/\.\.?(/|\?|$)" 1;
  }

  upstream session_check { server 127.0.0.1:${SESSION_CHECK_PORT}; }    # session serve --check-nginx
  upstream session_signin { server 127.0.0.1:${SESSION_SIGNIN_PORT}; }  # session serve --listen
  upstream site { server 127.0.0.1:${SITE_PORT}; }

  server {
    listen 127.0.0.1:${NGINX_PORT};
    merge_slashes on;          # the default, stated: $uri has no empty segments
    absolute_redirect off;     # the sign-in redirect stays a relative path, as on Envoy
    default_type application/json;  # the type of the answers nginx writes itself (return); the site's answers keep theirs

    if ($session_bad_path) { return 400 '{"error":"bad_path"}'; }

    # The sign-in paths: no check.
    location /_session/ {
      proxy_set_header Host $host;
      proxy_pass http://session_signin;
    }

    # Everything else asks the check first.
    location / {
      set $session_uri $uri$is_args$args;
      set $session_method $request_method;
      auth_request /_session_check;
      auth_request_set $session_cookie        $upstream_http_cookie;
      auth_request_set $session_authorization $upstream_http_authorization;
      auth_request_set $session_token         $upstream_http_x_session_token;
      auth_request_set $session_identity      $upstream_http_x_session_identity;
      auth_request_set $session_set_cookie    $upstream_http_set_cookie;
      auth_request_set $session_action        $upstream_http_x_session_action;
      auth_request_set $session_status        $upstream_http_x_session_status;
      auth_request_set $session_location      $upstream_http_x_session_location;
      auth_request_set $session_body          $upstream_http_x_session_body;
      error_page 401 = @session_answer;
      error_page 500 = @session_unavailable;   # the check could not be reached; the site's own 500 is not caught
      add_header Set-Cookie $session_set_cookie always;

      proxy_set_header Host               $host;
      proxy_set_header Cookie             $session_cookie;
      proxy_set_header Authorization      $session_authorization;
      proxy_set_header X-Session-Token    $session_token;
      proxy_set_header X-Session-Identity $session_identity;
      proxy_pass http://site;
    }

    # The check: a subrequest without a body.
    location = /_session_check {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length    "";
      proxy_set_header Host              $host;
      proxy_set_header X-Original-URI    $session_uri;
      proxy_set_header X-Original-Method $session_method;
      proxy_connect_timeout 1s;
      proxy_send_timeout 4s;
      proxy_read_timeout 4s;
      proxy_pass http://session_check/auth;
    }

    # A refusal: the check's answer from its markers. An unknown marker fails closed.
    location @session_answer {
      add_header Cache-Control no-store always;
      add_header Set-Cookie $session_set_cookie always;
      if ($session_action = redirect) { return 302 $session_location; }
      if ($session_action = page)     { rewrite ^ /_session_error_page last; }
      if ($session_status = 400)      { return 400 $session_body; }
      if ($session_status = 401)      { return 401 $session_body; }
      if ($session_status = 403)      { return 403 $session_body; }
      if ($session_status = 404)      { return 404 $session_body; }
      return 503 '{"error":"unavailable"}';
    }

    # The site's error page for a navigation whose token exchange was refused: a 403 from session, passed on as it is.
    location = /_session_error_page {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_pass http://session_check/error-page;
    }

    location @session_unavailable {
      add_header Cache-Control no-store always;
      return 503 '{"error":"unavailable"}';
    }
  }
}
