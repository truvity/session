# An Envoy in front of one site, asking session before each request (decision 0011). Two listeners show the two modes:
# GRPC_MODE_PORT asks the check over gRPC (preferred), HTTP_MODE_PORT over HTTP. The ${...} names are addresses to fill in;
# the integration test (internal/envoy, `just test-envoy`) fills them with its own and runs this file in Envoy as it is.
#
# What every site needs from it:
# - the path the check sees is the path the router uses: normalize_path, merge_slashes, and escaped slashes refused;
# - the sign-in prefix /_session/ goes to session without a check (ExtAuthzPerRoute disabled);
# - the check sees only headers, never the body, and only the ones it needs (allowed_headers);
# - fail closed: failure_mode_allow false, and 503 when the check cannot be reached; the timeout is longer than session's
#   store timeout (1.5 s) plus its exchange timeout (2 s), so session's own 503 is the one the client sees, also on a route
#   of mode exchange whose issuer is slow.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: ${ADMIN_PORT} } }
static_resources:
  listeners:
  - name: grpc_mode
    address: { socket_address: { address: 127.0.0.1, port_value: ${GRPC_MODE_PORT} } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: grpc_mode
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          route_config:
            name: site
            virtual_hosts:
            - name: site
              domains: ["*"]
              routes:
              - match: { prefix: "/_session/" }
                route: { cluster: session_signin }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match: { prefix: "/" }
                route: { cluster: site }
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              status_on_error: { code: ServiceUnavailable }
              allowed_headers:
                patterns:
                - { exact: cookie }
                - { exact: accept }
                - { exact: sec-fetch-mode }
                - { exact: sec-fetch-site }
                - { exact: origin }
                - { exact: x-requested-with }
              grpc_service:
                envoy_grpc: { cluster_name: session_check_grpc }
                timeout: 4s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: http_mode
    address: { socket_address: { address: 127.0.0.1, port_value: ${HTTP_MODE_PORT} } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: http_mode
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          route_config:
            name: site
            virtual_hosts:
            - name: site
              domains: ["*"]
              routes:
              - match: { prefix: "/_session/" }
                route: { cluster: session_signin }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match: { prefix: "/" }
                route: { cluster: site }
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              status_on_error: { code: ServiceUnavailable }
              allowed_headers:
                patterns:
                - { exact: cookie }
                - { exact: accept }
                - { exact: sec-fetch-mode }
                - { exact: sec-fetch-site }
                - { exact: origin }
                - { exact: x-requested-with }
              http_service:
                server_uri: { uri: "http://session-check", cluster: session_check_http, timeout: 4s }
                path_prefix: /check
                authorization_response:
                  # The headers an allow answer sets on the upstream request; x-envoy-auth-headers-to-remove names the ones
                  # Envoy removes from it.
                  allowed_upstream_headers:
                    patterns:
                    - { exact: cookie }
                    - { exact: authorization }
                    - { exact: x-session-token }
                    - { exact: x-session-identity }
                  allowed_client_headers:
                    patterns:
                    - { exact: location }
                    - { exact: content-type }
                    - { exact: cache-control }
                    - { exact: set-cookie }
                  allowed_client_headers_on_success:
                    patterns:
                    - { exact: set-cookie }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: session_check_grpc
    type: STATIC
    connect_timeout: 1s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: session_check_grpc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: ${SESSION_GRPC_PORT} } } } }] }]
  - name: session_check_http
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: session_check_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: ${SESSION_HTTP_PORT} } } } }] }]
  - name: session_signin
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: session_signin
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: ${SESSION_SIGNIN_PORT} } } } }] }]
  - name: site
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: site
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: ${SITE_PORT} } } } }] }]
