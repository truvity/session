# Throwaway spike config: nginx auth_request against the session check (HTTP adapter, nginx mode).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  access_log off;
  merge_slashes on;
  server {
    listen 127.0.0.1:18082;

    # the check subrequest: headers only, no body
    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:18090/nginx/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI ORIG_URI;
      proxy_set_header X-Original-Method $request_method;
    }

    # sign-in paths: no check
    location /_session/ { proxy_pass http://127.0.0.1:18090; }

    location / {
      auth_request /_auth;
      auth_request_set $s_user   $upstream_http_x_session_user;
      auth_request_set $s_email  $upstream_http_x_session_email;
      auth_request_set $s_groups $upstream_http_x_session_groups;
      auth_request_set $s_authz  $upstream_http_authorization;
      auth_request_set $s_cookie $upstream_http_cookie;
      auth_request_set $s_setck  $upstream_http_set_cookie;
      auth_request_set $s_action $upstream_http_x_session_action;
      auth_request_set $s_loc    $upstream_http_x_session_location;
      error_page 401 = @unauth;
      add_header Set-Cookie $s_setck always;
      # always set: an empty value makes nginx drop the header, so a browser-sent value cannot pass
      proxy_set_header X-Session-User   $s_user;
      proxy_set_header X-Session-Email  $s_email;
      proxy_set_header X-Session-Groups $s_groups;
      proxy_set_header Authorization    $s_authz;
      proxy_set_header Cookie           $s_cookie;
      proxy_pass http://127.0.0.1:18095;
    }
    location @unauth {
      if ($s_action = redirect) { return 302 $s_loc; }
      default_type application/json;
      return 401 '{"error":"login_required","login_url":"/_session/login"}';
    }
  }
}
